# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  # Named explicitly: devenv's default differs between machines (nixpkgs-weekly on the
  # workstation, devenv-nixpkgs/rolling in a locki sandbox), and each would re-lock
  # devenv.lock its own way. Matches the official binary cache; moved by `devenv update`.
  nixpkgs:
    url: https://flakehub.com/f/DeterminateSystems/nixpkgs-weekly/0.1
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs

# The Android SDK/NDK are unfree and need their licence accepted.
allow_unfree: true
android_sdk:
  accept_license: true
